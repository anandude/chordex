services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
      ALLOWED_ORIGINS: http://localhost:3000
      MAX_FILE_SIZE_MB: "20"
      CHORD_ENGINE: auto
      ENABLE_LYRICS: "1"
      WHISPER_MODEL: small
      LYRICS_SEPARATION_BACKEND: demucs
      LYRICS_LRCLIB: "1"
      LYRICS_ALIGNMENT: "1"
      JOB_TIMEOUT_S: "7200"
      # hf-xet stalls on some networks; see backend/pipeline/hf_setup.py
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - uploads:/data/uploads
    depends_on:
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  worker:
    build: ./backend
    environment:
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
      CHORD_ENGINE: auto
      ENABLE_LYRICS: "1"
      WHISPER_MODEL: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      LYRICS_SEPARATION_BACKEND: demucs
      LYRICS_LRCLIB: "1"
      LYRICS_ALIGNMENT: "1"
      LYRICS_LLM_CLEANUP: "0"
      LYRICS_CACHE_DIR: /data/lyrics_cache
      JOB_TIMEOUT_S: "7200"
      # hf-xet stalls on some networks; see backend/pipeline/hf_setup.py
      HF_HUB_DISABLE_XET: "1"
    # Persist the HF model cache across container rebuilds — the per-language
    # ASR weights are 0.5–1.5 GB each and are otherwise re-downloaded.
    volumes:
      - uploads:/data/uploads
      - lyrics_cache:/data/lyrics_cache
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - redis
    command: python worker.py

  # S3 scale-out (optional, commented by default): a dedicated lyrics worker
  # lets chords and lyrics run in parallel. Costs ~2x RAM — each process
  # loads its own demucs + whisper weights, so only enable with headroom.
  # The default single worker serves chord_jobs first, then lyrics_jobs.
  # lyrics-worker:
  #   build: ./backend
  #   environment:
  #     REDIS_URL: redis://redis:6379
  #     UPLOAD_DIR: /data/uploads
  #     ENABLE_LYRICS: "1"
  #     WHISPER_MODEL: small
  #     WHISPER_DEVICE: cpu
  #     WHISPER_COMPUTE_TYPE: int8
  #     LYRICS_SEPARATION_BACKEND: demucs
  #     LYRICS_CACHE_DIR: /data/lyrics_cache
  #     JOB_TIMEOUT_S: "7200"
  #     HF_HUB_DISABLE_XET: "1"
  #   volumes:
  #     - uploads:/data/uploads
  #     - lyrics_cache:/data/lyrics_cache
  #     - hf_cache:/root/.cache/huggingface
  #   depends_on:
  #     - redis
  #   command: python worker.py lyrics_jobs

volumes:
  uploads:
  lyrics_cache:
  hf_cache:
  redis_data:
