name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Python dependencies (CPU-only torch)
        run: |
          python -m pip install -U pip wheel
          # CPU wheels first, so demucs/transformers don't pull multi-GB CUDA torch
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy==1.26.4" "setuptools>=69,<81"
          python -m pip install -r requirements.txt --no-build-isolation
      - name: Tests
        env:
          ENABLE_LYRICS: "1"
          LYRICS_DEVICE: cpu
          WHISPER_DEVICE: cpu
        run: python -m pytest -q

  frontend:
    name: Frontend lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
